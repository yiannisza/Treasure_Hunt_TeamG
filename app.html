<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play – Team G Treasure Hunt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- APP HEADER -->
<header class="app-header">
    <a href="index.html" class="app-logo">⚓ Team G</a>

    <div class="score-badge">
        <span class="label">Score</span>
        <span class="value" id="Displayscore">–</span>
    </div>

    <div class="timer-badge">
        ⏱ <span class="timer">30:00</span>
    </div>
</header>

<!-- QUESTION CARD -->
<main class="question-card">

    <div class="question-number" id="question-number">Loading question…</div>

    <div class="question-text" id="question">
        <!-- Question text injected by app.js -->
    </div>

    <!-- Answer options (injected by app.js based on question type) -->
    <div id="options" class="options-grid"></div>

    <!-- Action row: skip + location (shown conditionally) -->
    <div class="action-row">
        <div id="skip"     style="display:none; flex:1;"></div>
        <div id="location" style="display:none; flex:1;"></div>
    </div>

</main>

<!-- Toast notification (created dynamically by app.js) -->

<script src="app.js"></script>

</body>
</html>
