<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play – Team G Treasure Hunt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
    <a href="index.html" class="app-logo">⚓ Team G</a>

    <div class="score-badge">
        <span class="label">Score</span>
        <span class="value" id="Displayscore">–</span>
    </div>

    <div class="timer-badge">
        ⏱ <span class="timer">30:00</span>
    </div>
</header>

<script>
    let opts = {
        ['continuous']: true,
        ['video']: document.getElementById('preview'),
        ['mirror']: false,
        ['captureImage']: false,
        ['backgroundScan']: true,
// Only applies to continuous mode. The period, in milliseconds, before the same QR
// code will be recognized in succession. Default 5000 (5 seconds).
        ['refractoryPeriod']: 5000,
        ['scanPeriod']: 1
    };

    let camera_index = 0;
    let all_cameras;

    let scanner = new Instascan['Scanner'](opts);
    document.getElementById("start").addEventListener('click', function () {
        Instascan['Camera']['getCameras']().then(function (cameras) {
            all_cameras = cameras;
            if (cameras.length > 0) {
                scanner['start'](cameras[camera_index]);
            }
            else {
                console.error('No cameras found.');
                alert("No cameras found.");
            }
        }).catch(function (e) {
            console.error(e);
        });

        scanner['addListener']('scan', function (content) {
            console.log(content);
            document.getElementById("content").innerHTML = content;
            scanner['stop']();
        });
    });

    document.getElementById("change").addEventListener('click', function () {
        camera_index++;
        if (all_cameras && camera_index >= all_cameras.length) {
            camera_index = 0;
        }
        console.log(camera_index);
        if (all_cameras && all_cameras.length > 0) {
            scanner['start'](all_cameras[camera_index]);
        }
    });


</script>
<main class="question-card">

    <div class="question-number" id="question-number">Loading question…</div>

    <div class="question-text" id="question">
    </div>


    <div id="options" class="options-grid"></div>


    <div class="action-row">
        <div id="skip"     style="display:none; flex:1;"></div>
        <div id="location" style="display:none; flex:1;"></div>
    </div>

</main>


<script src="app.js"></script>

</body>
</html>
